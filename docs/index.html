<style>
/* Layout: one narrow phone column; sticky week bar on top, tab bar fixed at the bottom. */

  --accent: #5cb87d; --accent-fg: #0d1a12; --accent-soft: #1f3a29; --warm: #ec8a68; --warm-soft: #3a231b; --frost: #7fb6dc; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1b231e; --fg: #e5ede7; --muted: #9aaa9f; --line: #2c3830;
  --accent: #5cb87d; --accent-fg: #0d1a12; --accent-soft: #1f3a29; --warm: #ec8a68; --warm-soft: #3a231b; --frost: #7fb6dc; color-scheme: dark }

[hidden] { display: none !important; }

body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
.plan-head { display: flex; align-items: baseline; gap: 10px; }

.tally.full { color: var(--accent); }
.dinners { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
input, select { font: inherit; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.choice { display: grid; gap: 10px; }
.manage { display: grid; gap: 18px; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 8px; border-radius: 8px; }

.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip-help { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
.edit-link { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.freezer { display: grid; gap: 6px; }
.frzrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.frzrow:last-child { border-bottom: 0; }
.frzrow .name { flex: 1; min-width: 0; font-weight: 500; }
.step { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 600; line-height: 1; }
.frzrow b { width: 2ch; text-align: center; font-variant-numeric: tabular-nums; font-size: 18px; font-family: var(--display); }
.frzrow b.zero { color: var(--warm); }
.muted { color: var(--muted); }
.modepick { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.modepick legend { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.radio { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font-weight: 400; cursor: pointer; }
.radio input { width: auto; margin-top: 3px; accent-color: var(--accent); }

.radio small { display: block; color: var(--muted); font-size: 13px; }
.filebtn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.note.frost { background: var(--accent-soft); }
.ing-count { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.ing-count.none { color: var(--warm); }
textarea { font: inherit; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; resize: vertical; line-height: 1.5; }
.shop-actions > * { flex: 0 1 auto; }
.shopline { display: flex; align-items: center; gap: 4px; }
.shoprow { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 52px; }
.shoprow.static { cursor: default; }
.shoprow .name { flex: 1; min-width: 0; font-weight: 500; }
.shoprow .for { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.shoprow .box { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: transparent; }
.shoprow[aria-pressed="true"] { background: transparent; }
.shoprow[aria-pressed="true"] .name { text-decoration: line-through; color: var(--muted); }
.shoprow[aria-pressed="true"] .box { background: var(--muted); border-color: var(--muted); color: var(--surface); }
.extra-form input { flex: 1 1 200px; }
.extra-form .btn { flex: 0 0 auto; }
details.group summary { list-style: none; cursor: pointer; }
details.group summary::-webkit-details-marker { display: none; }
details.group summary h3::after { content: "Show"; font-family: var(--body); font-size: 13px; color: var(--accent); letter-spacing: 0; text-transform: none; margin-left: 8px; }

.center { text-align: center; }
@media (prefers-reduced-motion: no-preference) { .meal, .btn, nav.tabs button { transition: background .15s, border-color .15s, color .15s; } }
</style>

<body>
<header class="top"><div class="wrap">
  <div class="toprow">
    <div class="brand">Dinner Decide<small id="weekLabel">This week</small></div>
    <button class="iconbtn" id="helpBtn" aria-label="How it works">?</button>
    <button class="whoami" id="whoBtn" hidden></button>
  </div>
  <div class="weekrow" id="weekRow" hidden>
    <div class="seg" role="group" aria-label="Which week">
      <button id="wk0">This week</button><button id="wk1">Next week</button>
    </div>
    <button class="newweek" id="newWeek">+ New week</button>
  </div>
</div></header>

<main class="wrap" id="app" aria-live="polite">
  <p class="muted center">Loading your meals…</p>
</main>

<nav class="tabs" id="tabs" hidden><div class="wrap">
  <button data-tab="pick">Pick</button>
  <button data-tab="week">Dinners</button>
  <button data-tab="shop">Shop</button>
  <button data-tab="meals">Meals</button>
</div></nav>

<script>
// Inside Claude the page gets a live shared database; anywhere else (e.g. GitHub Pages) it saves in this browser.
const LOCAL = !(window.claude && typeof window.claude.use === "function");
function baseNights() { const n = S.settings && S.settings.nights; return typeof n === "number" ? n : (LOCAL ? 7 : 6); }
function mode() { return LOCAL ? ((S.settings && S.settings.mode) || "links") : "live"; }
const STARTER_MEALS = [
  ["Spaghetti Bolognese", "Pasta", ["spaghetti", "beef mince", "onion", "garlic", "carrot", "chopped tomatoes", "tomato puree", "parmesan"]],
  ["Macaroni Cheese", "Pasta", ["macaroni", "cheddar", "milk", "butter", "plain flour"]],
  ["Chicken Curry", "Rice", ["rice", "chicken thighs", "onion", "garlic", "ginger", "curry paste", "coconut milk"]],
  ["Chilli con Carne", "Rice", ["rice", "beef mince", "kidney beans", "onion", "red pepper", "chopped tomatoes", "chilli powder"]],
  ["Fajitas", "Bread", ["tortilla wraps", "chicken breast", "peppers", "onion", "fajita seasoning", "soured cream", "cheddar"]],
  ["Homemade Pizza", "Bread", ["pizza bases", "passata", "mozzarella", "toppings"]],
  ["Sausage and Mash", "Potato", ["sausages", "potatoes", "butter", "milk", "gravy granules", "peas"]],
  ["Fish Pie", "Potato", ["fish pie mix", "potatoes", "milk", "butter", "plain flour", "peas"]],
  ["Roast Chicken Dinner", "Potato", ["whole chicken", "potatoes", "carrots", "broccoli", "gravy granules"]],
  ["Stir Fry", "Noodles", ["noodles", "chicken breast", "peppers", "beansprouts", "spring onions", "soy sauce"]],
];
function tourSteps() {
  const first = mode() === "links"
    ? "Every week, each of you ticks the meals you'd happily eat on your own phone, taps Done, then sends your picks to the other person as a link."
    : mode() === "shared"
    ? "Every week, each of you ticks the meals you'd happily eat. Tap Done, then pass the phone over. Your picks stay hidden until you've both finished."
    : "Every week, each of you ticks the meals you'd happily eat. It's quick: tap, tap, Done. You can't see each other's picks until you've both finished.";
  return [["1", "Each of you picks", first]].concat(TOUR);
}
const TOUR = [
  ["2", "The app matches", "Meals you both picked become the week's dinners, spread across the carbs. Fewer than you need? It shows the ones only one of you picked so you can agree the rest."],
  ["3", "Cook extra, freeze, repeat", "On any dinner, tap Leftovers or Freeze extra. Leftovers fill a later night, frozen portions are counted for another week."],
  ["4", "The shopping list writes itself", "The Shop tab lists everything for the week's dinners. Cross off what's already in the cupboard, copy the rest."],
  ["5", "Start each week with + New week", "Tap + New week, say how many evenings you're out, then pick. That's the whole routine."],
];
const CARB_COLORS = { pasta: "var(--c-pasta)", rice: "var(--c-rice)", bread: "var(--c-bread)", potato: "var(--c-potato)", noodles: "var(--c-noodles)" };
const store = {
  get(k) { try { return localStorage.getItem("dd:" + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem("dd:" + k) : localStorage.setItem("dd:" + k, v); } catch {} }
};

function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function thisWeek() { return mondayOf(new Date()); }
function nextWeek() { const m = thisWeek(); m.setDate(m.getDate() + 7); return m; }
function defaultWeek() {
  const saved = store.get("week");
  if (saved === weekId(thisWeek())) return thisWeek();
  if (saved === weekId(nextWeek())) return nextWeek();
  const d = new Date().getDay(); return d === 6 || d === 0 ? nextWeek() : thisWeek();
}
function isNextWeek() { return weekId(S.week) === weekId(nextWeek()); }
function weekId(m) { return m.getFullYear() + "-" + String(m.getMonth() + 1).padStart(2, "0") + "-" + String(m.getDate()).padStart(2, "0"); }
function weekLabel(m) { return "Week of " + m.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "meal"; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const S = {
  db: null, offline: false, slow: false, readOnly: false,
  meals: null, people: null,
  me: store.get("me"),
  week: defaultWeek(),
  picks: {}, plan: null, weekLoaded: false,
  draft: null, saveTimer: null,
  tab: store.get("tab") || "pick",
  pendingDelete: null,
  editingNames: false,
  asking: null, tour: null, starterBusy: false,
  settings: {}, incoming: null, restoreData: null, toast: null, storageError: false,
  editing: null, nameDraft: null, ingDraft: null,
  frzPending: {}, frzTimers: {},
  shop: {}, shopExists: false, staples: {}, staplesExists: false, stapleMode: false, copied: false,
};
let unsubWeek = [];

// ---------- data helpers ----------
function carbs() {
  const order = []; const seen = new Set();
  for (const m of sortedMeals()) { const c = m.carb || "Other"; if (!seen.has(c)) { seen.add(c); order.push(c); } }
  return order;
}
function sortedMeals() { return (S.meals || []).slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name)); }
function mealById(id) { return (S.meals || []).find(m => m.id === id); }

function suggestion(matched) {
  // Spread across carbs: round-robin through carb groups, starting point and in-group order varied per week.
  const wk = weekId(S.week);
  const groups = carbs().map(c => matched.filter(id => (mealById(id).carb || "Other") === c)
    .sort((x, y) => hash(wk + x) - hash(wk + y))).filter(g => g.length);
  if (!groups.length) return [];
  const start = hash(wk) % groups.length;
  const rot = groups.slice(start).concat(groups.slice(0, start));
  const out = [];
  const n = target();
  while (out.length < n && rot.some(g => g.length)) for (const g of rot) { if (g.length && out.length < n) out.push(g.shift()); }
  return out;
}

// ---------- browser storage (used outside Claude) ----------
function makeLocalDb() {
  const KEY = "dinner-decide-data";
  let docs = {};
  try { docs = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { docs = {}; }
  const subs = new Set();
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(docs)); S.storageError = false; } catch { S.storageError = true; } };
  const notify = () => setTimeout(() => subs.forEach(f => f()), 0);
  const meta = { fromCache: false, hasPendingWrites: false };
  const snap = p => ({ id: p.split("/").pop(), exists: p in docs, data: () => clone(docs[p]), metadata: meta });
  const listen = (f) => { subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  function doc(p) {
    return {
      path: p,
      get: async () => snap(p),
      set: async b => { docs[p] = clone(b); persist(); notify(); },
      update: async b => { if (!(p in docs)) throw { code: "invalid_argument", message: "Document does not exist" }; docs[p] = deepMerge(docs[p], clone(b)); persist(); notify(); },
      delete: async () => { delete docs[p]; persist(); notify(); },
      onSnapshot: next => listen(() => next(snap(p))),
      collection: c => col(p + "/" + c),
    };
  }
  function col(p) {
    const depth = p.split("/").length + 1;
    const q = () => { const ds = Object.keys(docs).filter(k => k.startsWith(p + "/") && k.split("/").length === depth).sort().map(snap); return { docs: ds, size: ds.length, metadata: meta }; };
    return { path: p, doc: id => doc(p + "/" + (id || Math.random().toString(36).slice(2))), get: async () => q(), onSnapshot: next => listen(() => next(q())) };
  }
  return { doc, collection: col, exportAll: () => clone(docs), importAll: d => { docs = clone(d) || {}; persist(); notify(); } };
}

// ---------- sending data between phones as a link ----------
function b64u(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }

      const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return "z" + b64u(new Uint8Array(await new Response(stream).arrayBuffer()));

}
async function unpackData(str) {

}
function toast(msg) { S.toast = msg; render(); clearTimeout(S.toastTimer); S.toastTimer = setTimeout(() => { S.toast = null; render(); }, 6000); }

    catch (e) { if (e && e.name === "AbortError") return; }

}
function mealsPayload() {

    meals: (S.meals || []).map(m => { const o = Object.assign({}, m); return o; }) };
}
async function readIncoming() {

function weekOk(wk) { return wk === weekId(thisWeek()) || wk === weekId(nextWeek()); }

async function applyIncoming() {

    for (const m of p.meals) { const { id, ...body } = m; await db.doc("meals/" + id).set(body); }
    await db.doc("app/staples").set({ items: p.staples || {} });
    await db.doc("app/settings").set(Object.assign({}, S.settings, { people: p.people, nights: p.nights, mode: p.mode }));
    if (!S.me || S.me === p.from) { S.me = other(p.from); store.set("me", S.me); }
    if (!store.get("tour")) S.tour = 0;
    toast("Meals added from " + (p.people && p.people[p.from] || "the other phone") + ".");
  } else if (p.t === "picks") {
    const { ids, missing } = mapMealIds(p.meals, p.names);
    await db.doc("weeks/" + p.wk + "/picks/" + p.from).set({ meals: ids, done: true, updatedAt: Date.now() });
    if (typeof p.target === "number") {

// ---------- subscriptions ----------
async function boot() {
  const loadTimer = setTimeout(() => { if (!S.meals) { S.slow = true; render(); } }, 10000);
  let db = null;
  if (LOCAL) { db = makeLocalDb(); try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }
  else { try { db = await window.claude.use("db"); } catch { db = null; } }
  if (!db) { clearTimeout(loadTimer); S.offline = true; render(); return; }
  S.db = db;
  db.collection("meals").onSnapshot(snap => {
    S.meals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); S.slow = false; }
    render();
  }, () => { clearTimeout(loadTimer); S.meals = S.meals || []; render(); });
  db.doc("app/staples").onSnapshot(snap => { S.staplesExists = snap.exists; S.staples = snap.exists ? (snap.data().items || {}) : {}; render(); }, () => {});
  db.doc("app/settings").onSnapshot(snap => { S.settings = snap.exists ? snap.data() : {}; S.people = S.settings.people || {}; render(); }, () => { S.people = S.people || {}; render(); });
  if (!LOCAL) try {
    const user = await window.claude.use("user");
    const can = user ? await user.can("data.write") : null;
    if (can === false) { S.readOnly = true; render(); }
  } catch {}
  subscribeWeek();
  readIncoming();
}

function subscribeWeek() {
  unsubWeek.forEach(u => { try { u(); } catch {} });
  unsubWeek = [];
  S.picks = {}; S.plan = null; S.weekLoaded = false; S.draft = null; S.shop = {}; S.shopExists = false;
  if (!S.db) return;
  const wk = weekId(S.week);
  let got = 0, resolve; S.weekReady = new Promise(r => resolve = r);
  const arrived = () => { if (++got === 2) resolve(); };
  let first1 = true, first2 = true;
  unsubWeek.push(S.db.collection("weeks/" + wk + "/picks").onSnapshot(snap => {
    const p = {}; snap.docs.forEach(d => { p[d.id] = d.data(); });
    S.picks = p; S.weekLoaded = true; render(); if (first1) { first1 = false; arrived(); }
  }, () => { S.weekLoaded = true; render(); if (first1) { first1 = false; arrived(); } }));
  unsubWeek.push(S.db.doc("weeks/" + wk).onSnapshot(snap => {
    S.plan = snap.exists ? snap.data() : null; render(); if (first2) { first2 = false; arrived(); }
  }, () => { if (first2) { first2 = false; arrived(); } }));
  unsubWeek.push(S.db.doc("weeks/" + wk + "/shop/list").onSnapshot(snap => {
    S.shopExists = snap.exists; S.shop = snap.exists ? snap.data() : {}; render();
  }, () => {}));

// ---------- writes ----------
function writeErr(e) { if (e && e.code === "invalid_argument") { S.readOnly = true; render(); } }
function savePicks(done) {

  const meals = [...myPicks()];
  const body = { meals, done: !!done, updatedAt: Date.now() };
  S.db.doc("weeks/" + weekId(S.week) + "/picks/" + S.me).set(body).then(() => { if (!S.saveTimer) S.draft = null; }).catch(writeErr);
}
function queueSave() { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(() => savePicks(false), 700); }
function adjustFreezer(m, delta) {

  clearTimeout(S.frzTimers[m.id]);
  S.frzTimers[m.id] = setTimeout(() => {
    S.db.doc("meals/" + m.id).update({ freezer: n }).then(() => { if (S.frzPending[m.id] === n) { delete S.frzPending[m.id]; render(); } }).catch(writeErr);
  }, 600);
}

function freezerEffect(final, howFor) {

  const out = {};
  for (const id of final) { const h = howFor(id); if (h === "freezer") out[id] = (out[id] || 0) - 1; if (h === "freeze") out[id] = (out[id] || 0) + 1; }
  return out;
}
function savePlan(final, howPatch) {

  const before = freezerEffect(oldFinal, howOf);
  const how = {};
  for (const id of final) how[id] = (howPatch && howPatch[id]) || howOf(id);
  const after = freezerEffect(final, id => how[id]);
  for (const id of new Set([...Object.keys(before), ...Object.keys(after)])) {
    const m = mealById(id); const d = (after[id] || 0) - (before[id] || 0);

}
function writeWeek(patch) {

  S.db.doc("weeks/" + weekId(S.week)).set(S.plan).catch(writeErr);
  render();
}
function matchedFrom(aMeals, bMeals) {
  const A = new Set(aMeals || []), B = new Set(bMeals || []);
  return sortedMeals().map(m => m.id).filter(id => A.has(id) && B.has(id));
}
// The week's dinners: the saved plan, or the suggested mix once both have picked.
function weekFinal() {
  const s = storedFinal(); if (s) return validIds(s);
  if (isDone("a") && isDone("b")) return suggestion(matchedFrom(S.picks.a.meals, S.picks.b.meals));
  return null;
}

// ---------- shopping list ----------
function ingKey(name) { return slug(name.trim().replace(/\s+/g, " ")); }
function niceName(s) { s = s.trim().replace(/\s+/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); }
function isStaple(k) { return !!(S.staples && S.staples[k]); }
function shopDoc() { return S.db.doc("weeks/" + weekId(S.week) + "/shop/list"); }
function writeShop(patch) {
  // Nested maps merge on update, so two phones ticking different items never overwrite each other.
  S.shop = deepMerge(S.shop || {}, patch); render();
  (S.shopExists ? shopDoc().update(patch) : shopDoc().set(S.shop).then(() => { S.shopExists = true; })).catch(writeErr);
}
function deepMerge(a, b) { const out = Object.assign({}, a); for (const [k, v] of Object.entries(b)) out[k] = v && typeof v === "object" && !Array.isArray(v) ? deepMerge(a[k] || {}, v) : v; return out; }
function shoppingItems(final) {
  const items = new Map(); const missing = []; const frozen = [];
  for (const id of final) {
    const m = mealById(id); if (!m) continue;
    const how = howOf(id);
    if (how === "freezer") { frozen.push(m); continue; }
    const label = how === "leftovers" || how === "freeze" ? m.name + " (make extra)" : m.name;
    const ings = (m.ingredients || []).filter(s => s && s.trim());
    if (!ings.length) { missing.push(m); continue; }
    for (const raw of ings) {
      const k = ingKey(raw); if (!k) continue;

      items.get(k).meals.push(label);
    }
  }
  const extras = Object.entries((S.shop && S.shop.extras) || {}).filter(([, v]) => v).map(([k, v]) => ({ key: "x-" + k, extraKey: k, name: niceName(v), meals: [] }));
  return { items: [...items.values()].sort((x, y) => x.name.localeCompare(y.name)), extras, missing, frozen };
}

}

function viewPick() {
  const me = S.me, them = other(me);
  const picks = myPicks();
  const done = isDone(me) && !S.draft;
  const all = sortedMeals().map(m => m.id);
  if (!all.length) return `<section class="card"><h2>No meals yet</h2><p class="lede">Add your meals on the Meals tab, then come back to pick.</p></section>`;
  const themName = esc(personName(them));
  const head = done
    ? (isDone(them) ? `<section><h1>Picks done</h1><p class="lede">${themName} has finished too. See your dinners on the Dinners tab.</p></section>`
      : mode() === "links" ? `<section><h1>Now send your picks</h1><p class="lede">Send them to ${themName} as a link. When ${themName} sends theirs back, open the link and your dinners appear.</p></section>`
      : mode() === "shared" ? `<section><h1>Pass the phone to ${themName}</h1><p class="lede">Your picks are saved and hidden. ${themName} picks next.</p></section>`
      : `<section><h1>Picks sent</h1><p class="lede">Waiting for ${themName} to finish. Their picks stay hidden until then.</p></section>`)
    : `<section><h1>What would you eat ${isNextWeek() ? "next week" : "this week"}?</h1><p class="lede">Tick everything you'd be happy with. ${esc(personName(them))} ${mode() === "shared" ? "can't see your picks while it's your turn." : "won't see your picks until you've both finished."}</p></section>`;
  const body = mealGroups(all, id => {
    const m = mealById(id); const on = picks.has(id);
    return `<button class="meal" data-pick="${esc(id)}" aria-pressed="${on}" ${done || S.readOnly ? "disabled" : ""}><span class="name">${esc(m.name)}${badges(m)}</span><span class="tick">✓</span></button>`;
  });
  const foot = done
    ? `<div class="row"><button class="btn ghost" id="editPicks">Change my picks</button></div>
       <div class="sticky-done">${isDone(them) ? `<button class="btn" data-goto="week">See the dinners</button>`
         : mode() === "links" ? `<button class="btn" id="sendPicks">Send my picks to ${themName}</button>`
         : mode() === "shared" ? `<button class="btn" id="passPhone">I'm ${themName}, my turn</button>` : ""}</div>`
    : `<div class="sticky-done"><button class="btn" id="donePicks" ${S.readOnly ? "disabled" : ""}>Done · ${picks.size} picked</button></div>`;
  return head + weekInfo() + body + foot;
}

function weekInfo() {
  const out = eveningsOut();
  return `<div class="weekinfo"><span>${out ? `Out ${out} evening${out > 1 ? "s" : ""}` : "In every evening"} · <b>${target()} dinners</b> to plan</span><button class="linkbtn" id="changeOut">Change</button></div>`;
}

function viewOut() {
  const w = S.asking; const cur = S.askingCurrent;
  const btns = [0, 1, 2, 3, 4].filter(n => n < baseNights()).map(n => `<button data-out="${n}" aria-pressed="${cur === n}"><span>${n}</span><small>${baseNights() - n} dinners</small></button>`).join("");
  return `<section class="card">
    <p class="muted" style="margin:0">${esc(weekLabel(w))}</p>
    <h1>How many evenings are you out ${weekId(w) === weekId(nextWeek()) ? "next week" : "this week"}?</h1>
    <p class="lede">${baseNights() < 7 ? `You plan ${baseNights()} nights a week, so only count evenings you'd normally cook.` : "Only count evenings you'd normally be cooking."}</p>
    <div class="outgrid">${btns}</div>
    <button class="btn ghost small" id="cancelOut">Cancel</button>
  </section>`;
}

function viewTour() {
  const i = S.tour; const [n, title, text] = tourSteps()[i]; const last = i === tourSteps().length - 1;
  return `<section class="card tour">
    <span class="stepno">Step ${n} of ${tourSteps().length}</span>
    <h1>${esc(title)}</h1>
    <p class="lede">${esc(text)}</p>
    <div class="dots">${TOUR.map((_, j) => `<span class="${j === i ? "on" : ""}"></span>`).join("")}</div>
    <button class="btn" id="tourNext">${last ? "Got it" : "Next"}</button>
    ${last ? "" : `<button class="btn ghost small" id="tourSkip">Skip</button>`}
  </section>`;
}

function viewStarter() {
  return `<section class="card">
    <h1>Add your meals</h1>
    <p class="lede">Start with ten everyday meals (spag bol, curry, pizza and so on) that you can edit or delete, or start with an empty list and add your own.</p>
    <button class="btn" id="starterYes" ${S.starterBusy || S.readOnly ? "disabled" : ""}>${S.starterBusy ? "Adding…" : "Start with 10 example meals"}</button>
    <button class="btn ghost" id="starterNo">Start with an empty list</button>
  </section>`;
}

function viewWeek() {
  const me = S.me;
  if (!S.weekLoaded) return `<p class="muted center">Loading this week…</p>`;
  const status = `<div class="status">${["a", "b"].map(k => `<div class="person"><b>${esc(personName(k))}${k === me ? " (you)" : ""}</b><span class="pill ${isDone(k) ? "done" : "wait"}">${isDone(k) ? "Finished picking" : "Still picking"}</span></div>`).join("")}</div>`;
  if (!storedFinal() && (!isDone("a") || !isDone("b"))) {
    const them = esc(personName(other(me)));
    const hint = mode() === "links" ? (isDone(me) ? `Waiting for ${them}'s picks. When ${them} sends you a link, open it and your dinners appear here.` : `Make your picks, then send them to ${them}.`) : "Once you've both tapped Done on the Pick tab, your dinners show up here.";
    return `<section><h1>Not decided yet</h1><p class="lede">${hint}</p></section>${weekInfo()}${status}
      ${!isDone(me) ? `<button class="btn" data-goto="pick">Make my picks</button>` : mode() === "links" && !isDone(other(me)) ? `<button class="btn ghost" id="sendPicks">Send my picks again</button>` : ""}`;
  }
  const T = target();
  const A = new Set(validIds((S.picks.a || {}).meals)), B = new Set(validIds((S.picks.b || {}).meals));
  const order = sortedMeals().map(m => m.id);
  const matched = order.filter(id => A.has(id) && B.has(id));
  const onlyOne = order.filter(id => A.has(id) !== B.has(id));
  const final = weekFinal() || [];
  const sugg = suggestion(matched);
  const isCustom = storedFinal() && (final.length !== sugg.length || final.some((id, i) => id !== sugg[i]));
  const finalSet = new Set(final);
  const used = nightsUsed(final);
  const full = used >= T;
  const ro = S.readOnly ? "disabled" : "";

  const rows = []; let n = 0;
  for (const id of final) {
    const m = mealById(id); const how = howOf(id); const frz = freezerCount(m);
    const modeBtn = (key, label, extraDisabled) => `<button class="mode" data-mode="${key}" data-meal="${esc(id)}" aria-pressed="${how === key}" ${ro} ${extraDisabled && how !== key ? "disabled" : ""}>${label}</button>`;
    const modes = [
      modeBtn("leftovers", "Leftovers", full),
      modeBtn("freeze", "Freeze extra"),
      (frz > 0 || how === "freezer") ? modeBtn("freezer", `From freezer${how === "freezer" ? "" : ` (${frz})`}`) : "",
    ].join("");
    const note = how === "leftovers" ? "Make extra for another night" : how === "freeze" ? "Make extra, 1 portion goes in the freezer" : how === "freezer" ? "Take it out the night before" : "";
    rows.push(`<li><span class="num">${++n}</span><span class="dot" style="background:${carbColor(m.carb)}"></span><span class="name">${esc(m.name)} <span class="carb">· ${esc(m.carb || "Other")}${note ? " · " + note : ""}</span>${badges(m)}<span class="modes">${modes}</span></span><button class="x" data-remove="${esc(id)}" aria-label="Remove ${esc(m.name)}" ${ro}>×</button></li>`);
    if (how === "leftovers") rows.push(`<li class="lo"><span class="num">${++n}</span><span class="dot" style="background:${carbColor(m.carb)}"></span><span class="name">Leftovers: ${esc(m.name)}</span></li>`);
  }
  while (n < T) rows.push(`<li><span class="num">${++n}</span><span class="name empty-slot">Pick one below</span></li>`);

  const addBtn = (id, tag) => { const m = mealById(id); return `<button class="meal" data-add="${esc(id)}" aria-pressed="false" ${full || S.readOnly ? "disabled" : ""}><span class="dot" style="background:${carbColor(m.carb)}"></span><span class="name">${esc(m.name)}${badges(m)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ""}<span class="tick">+</span></button>`; };
  const spareMatched = matched.filter(id => !finalSet.has(id));
  const spareOne = onlyOne.filter(id => !finalSet.has(id));
  const others = order.filter(id => !finalSet.has(id) && !A.has(id) && !B.has(id));

  let intro;
  if (used > T) intro = `That's ${used} nights but you only need ${T}. Remove one.`;
  else if (full) intro = `All ${T} nights sorted. Tap × to swap one, or Leftovers / Freeze extra to cook more.`;
  else if (matched.length && final.length) intro = `${T - used} more to choose. Pick from the meals only one of you picked, or use Leftovers to cover a night.`;
  else intro = `None of your picks matched. Choose ${T} together from the lists below.`;

  return `<section><h1>${isNextWeek() ? "Next week's" : "This week's"} dinners</h1><p class="lede">${intro}</p></section>
    ${weekInfo()}
    <section class="plan">
      <div class="plan-head"><h2>Dinners</h2><span class="tally ${used === T ? "full" : ""}">${used} / ${T}</span></div>
      <ol class="dinners">${rows.join("")}</ol>
      ${isCustom && (isDone("a") && isDone("b")) ? `<button class="btn ghost small" id="resetPlan" ${ro}>Go back to the suggested mix</button>` : ""}
    </section>
    ${mode() === "links" ? `<button class="btn" id="sendPlan">Send these dinners to ${esc(personName(other(me)))}</button><p class="muted center" style="margin-top:-8px;font-size:13px">Send again whenever you change the plan, so both phones match.</p>` : ""}
    ${spareMatched.length ? `<section class="group"><h3>Also picked by both of you<span class="count">${spareMatched.length}</span></h3><div class="list">${spareMatched.map(id => addBtn(id)).join("")}</div></section>` : ""}
    ${spareOne.length ? `<section class="group"><h3>Picked by one of you<span class="count">${spareOne.length}</span></h3><div class="list">${spareOne.map(id => addBtn(id, A.has(id) ? personName("a") : personName("b"))).join("")}</div></section>` : ""}
    ${!full && others.length ? `<details class="group"><summary><h3>Everything else<span class="count">${others.length}</span></h3></summary><div class="list">${others.map(id => addBtn(id)).join("")}</div></details>` : ""}
    ${status}`;
}

function viewShop() {
  const final = weekFinal();
  if (!final) return `<section><h1>Shopping list</h1><p class="lede">Your list appears here once you've both finished picking this week's dinners.</p></section>
    <button class="btn" data-goto="${isDone(S.me) ? "week" : "pick"}">${isDone(S.me) ? "See who's still picking" : "Make my picks"}</button>`;
  const { items, extras, missing, frozen } = shoppingItems(final);
  const main = items.filter(i => !isStaple(i.key)).concat(extras);
  const staples = items.filter(i => isStaple(i.key));
  const need = main.filter(i => !isCrossed(i.key)), got = main.filter(i => isCrossed(i.key));
  const ro = S.readOnly ? "disabled" : "";
  const row = i => {
    if (S.stapleMode && !i.extraKey) {
      const on = isStaple(i.key);
      return `<div class="shoprow static"><span class="name">${esc(i.name)}</span><button class="chip" data-staple="${esc(i.key)}" data-name="${esc(i.name)}" aria-pressed="${on}" ${ro}>${on ? "Staple ✓" : "Mark as staple"}</button></div>`;
    }
    const x = isCrossed(i.key);
    const forText = i.extraKey ? "Added by you" : i.meals.join(" · ");
    return `<div class="shopline"><button class="shoprow" data-cross="${esc(i.key)}" aria-pressed="${x}" ${ro}><span class="box">✓</span><span class="name">${esc(i.name)}<span class="for">${esc(forText)}</span></span></button>${i.extraKey ? `<button class="x" data-unextra="${esc(i.extraKey)}" aria-label="Remove ${esc(i.name)}" ${ro}>×</button>` : ""}</div>`;
  };
  const stapleNeed = staples.filter(i => !isCrossed(i.key)).length;
  return `<section><h1>Shopping list</h1><p class="lede">For this week's ${final.length} dinners. Tap anything you already have or have bought to cross it off.${LOCAL ? "" : " It updates on both phones."}</p></section>
    <div class="row shop-actions">
      <button class="btn small" id="copyList" ${need.length ? "" : "disabled"}>${S.copied === "list" ? "Copied" : "Copy list"}</button>
      <button class="btn ghost small" id="copyWaitrose" ${need.length ? "" : "disabled"}>${S.copied === "waitrose" ? "Copied" : LOCAL ? "Copy for online shop" : "Copy for Waitrose"}</button>
      <button class="btn ghost small" id="stapleMode">${S.stapleMode ? "Finish editing staples" : "Edit staples"}</button>
    </div>
    ${S.copied === "waitrose" ? `<p class="note frost">Copied. On your computer, open ${LOCAL ? "your supermarket's website" : "Waitrose"} in Chrome, make sure you're logged in, open Claude in Chrome and paste. Check the basket before you pay.</p>` : ""}
    ${S.stapleMode ? `<p class="note">Staples are things you usually have in, like oil, spices and stock. They move into "Check the cupboard" so the main list stays short.</p>` : ""}
    <section class="group"><h3>To get<span class="count">${need.length}</span></h3>
      <div class="list">${need.length ? need.map(row).join("") : `<p class="muted">Nothing left to get.</p>`}</div>
    </section>
    <form id="extraForm" class="row extra-form">
      <input id="extraName" maxlength="60" placeholder="Add something else, e.g. milk" aria-label="Add something else to the list">
      <button class="btn small" ${ro}>Add</button>
    </form>
    ${staples.length ? `<details class="group cupboard" ${S.cupboardOpen || S.stapleMode ? "open" : ""}><summary><h3>Check the cupboard<span class="count">${stapleNeed} to check</span></h3></summary>
      <div class="list">${staples.map(row).join("")}</div></details>` : ""}
    ${got.length && !S.stapleMode ? `<section class="group"><h3>Crossed off<span class="count">${got.length}</span></h3><div class="list">${got.map(row).join("")}</div></section>` : ""}
    ${frozen.length ? `<p class="note frost">From the freezer, nothing to buy: ${frozen.map(m => esc(m.name)).join(", ")}. Remember to take it out the night before.</p>` : ""}
    ${missing.length ? `<p class="note">No ingredients yet for ${missing.map(m => esc(m.name)).join(", ")}. Add them on the Meals tab and they'll appear here.</p>` : ""}`;
}

function viewMeals() {
  const ro = S.readOnly ? "disabled" : "";
  const groups = mealGroups(sortedMeals().map(m => m.id), id => {
    const m = mealById(id);
    if (S.editing !== id) { const n = (m.ingredients || []).length; return `<button class="meal" data-edit="${esc(id)}"><span class="name">${esc(m.name)}${badges(m)}<span class="ing-count${n ? "" : " none"}">${n ? n + " ingredients" : "No ingredients yet"}</span></span><span class="edit-link">Edit</span></button>`; }
    const conf = S.pendingDelete === id;
    const name = S.nameDraft && S.nameDraft.id === id ? S.nameDraft.value : m.name;
    const ingr = S.ingDraft && S.ingDraft.id === id ? S.ingDraft.value : (m.ingredients || []).join("\n");
    const carbOpts = carbs().map(c => `<option ${c === m.carb ? "selected" : ""}>${esc(c)}</option>`).join("");
    return `<form class="meal editor" data-editform="${esc(id)}">
      <div class="row">
        <label>Meal<input id="editName" maxlength="60" required value="${esc(name)}"></label>
        <label>Carb<select id="editCarb" ${ro}>${carbOpts}</select></label>
      </div>
      <label>Ingredients <span class="muted" style="font-weight:400">one per line</span><textarea id="editIngr" rows="${Math.max(4, ingr.split("\n").length + 1)}" placeholder="e.g.&#10;onions&#10;chopped tomatoes">${esc(ingr)}</textarea></label>
      <div class="chips">${FLAGS.map(([k, label]) => `<button type="button" class="chip" data-flag="${k}" aria-pressed="${!!m[k]}" ${ro}>${label}</button>`).join("")}</div>
      <p class="chip-help">Tags save as soon as you tap them. Defrost meals get a freezer count at the top of this page. Press Save for name and ingredient changes.</p>
      <div class="row">
        <button class="btn small" ${ro}>Save</button>
        <button type="button" class="btn ghost small" data-edit="">Close</button>
        <button type="button" class="del ${conf ? "confirm" : ""}" data-del="${esc(id)}" ${ro}>${conf ? "Tap again to remove" : "Remove meal"}</button>
      </div>
    </form>`;
  });
  const frozen = sortedMeals().filter(m => m.defrost);
  const freezer = `<section class="card"><h2>In the freezer</h2>${frozen.length
    ? `<p class="lede">Portions of each defrost meal you have frozen. Tap + when you freeze a batch, − when you use one.</p>
       <div class="freezer">${frozen.map(m => { const n = freezerCount(m); return `<div class="frzrow"><span class="name">${esc(m.name)}</span><button class="step" data-frz="${esc(m.id)}" data-d="-1" aria-label="One fewer ${esc(m.name)}" ${n <= 0 || S.readOnly ? "disabled" : ""}>−</button><b class="${n ? "" : "zero"}">${n}</b><button class="step" data-frz="${esc(m.id)}" data-d="1" aria-label="One more ${esc(m.name)}" ${ro}>+</button></div>`; }).join("")}</div>`
    : `<p class="lede">No defrost meals yet. Tap Edit on a meal below and turn on Defrost to track how many you have frozen.</p>`}</section>`;
  const opts = carbs().map(c => `<option>${esc(c)}</option>`).join("");
  return `<section><h1>Your meals</h1><p class="lede">${(S.meals || []).length} meals you both enjoy, grouped by carb. Tap a meal to edit it or tag it.</p></section>
    ${freezer}
    <form class="card" id="addForm">
      <h2>Add a meal</h2>
      <div class="row">
        <label>Meal<input id="newName" maxlength="60" required placeholder="e.g. Fajitas"></label>
        <label>Carb<select id="newCarb">${opts}<option value="__new">New carb…</option></select></label>
      </div>
      <label id="newCarbWrap" hidden>New carb name<input id="newCarbName" maxlength="30"></label>
      <button class="btn" ${S.readOnly ? "disabled" : ""}>Add meal</button>
    </form>
    <div class="manage">${groups}</div>
    ${viewHousehold()}`;
}

function viewHousehold() {
  const them = esc(personName(other(S.me)));
  const last = Number(store.get("lastBackup") || 0);
  const ago = last ? Math.round((Date.now() - last) / 86400000) : null;
  return `<section class="card">
    <h2>Your household</h2>
    <p class="lede">${esc(personName("a"))} and ${esc(personName("b"))} · ${baseNights()} nights a week${LOCAL ? ` · ${mode() === "shared" ? "one shared phone" : "a phone each"}` : ""}</p>
    <button class="btn ghost small" id="renameBtn">Change names and settings</button>
    ${LOCAL && mode() === "links" ? `<p class="lede">After you add or change meals, send them to ${them} so both phones have the same list. Freezer counts go too.</p>
      <button class="btn" id="sendMeals">Send meals to ${them}</button>` : ""}
    ${LOCAL ? `<p class="lede">Everything is saved in this browser on this phone. Back up now and then, in case the browser's data gets cleared.${ago != null ? ` Last backup: ${ago === 0 ? "today" : ago + " day" + (ago > 1 ? "s" : "") + " ago"}.` : ""}</p>
      <div class="row"><button class="btn small" id="backupBtn">Back up</button><label class="btn ghost small filebtn">Restore a backup<input type="file" id="restoreFile" accept="application/json,.json" hidden></label></div>` : ""}
  </section>`;
}

function viewRestore() {
  const d = S.restoreData; const meals = Object.keys(d.data || {}).filter(k => k.startsWith("meals/")).length;
  return `<section class="card"><h1>Restore this backup?</h1>
    <p class="lede">Saved ${esc(new Date(d.saved).toLocaleDateString())} with ${meals} meals. This replaces everything on this phone.</p>
    <button class="btn" id="restoreYes">Replace with backup</button><button class="btn ghost" id="restoreNo">Cancel</button></section>`;
}

function render() {
  const app = document.getElementById("app");
  document.getElementById("weekLabel").textContent = weekLabel(S.week);
  const tabs = document.getElementById("tabs"), who = document.getElementById("whoBtn");
  if (S.offline) {
    app.innerHTML = `<section class="card"><h2>Open this in Claude to use it</h2><p class="lede">Dinner Decide keeps your picks in a shared store that only works when you're signed in to claude.ai and open the page from its claude.ai link.</p></section>`;
    tabs.hidden = true; who.hidden = true; return;
  }
  if (!S.meals || S.people === null) {
    app.innerHTML = `<p class="muted center">${S.slow ? "Can't reach your meals yet. Check your connection; this page keeps trying." : "Loading your meals…"}</p>`;
    tabs.hidden = true; who.hidden = true; return;
  }
  if (S.incoming || S.restoreData) {
    app.innerHTML = S.incoming ? viewIncoming() : viewRestore(); tabs.hidden = true; who.hidden = true; document.getElementById("weekRow").hidden = true; window.scrollTo(0, 0); return;
  }
  const ro = (S.toast ? `<p class="note frost" role="status">${esc(S.toast)}</p>` : "") + (S.storageError ? `<p class="note">This browser wouldn't save your last change. It may be in private mode or out of space.</p>` : "") + (LOCAL ? "" : "") + (S.readOnly ? `<p class="note">You can look but not change anything. Ask whoever shared this to invite you by email as an Editor, and to turn off any public link.</p>` : "");
  const named = S.people.a && S.people.b;
  if (!named || !S.me || !S.people[S.me] || S.editingNames) {
    app.innerHTML = ro + viewSetup(); tabs.hidden = true; who.hidden = true; document.getElementById("weekRow").hidden = true; return;
  }
  who.hidden = false; who.textContent = personName(S.me) + (mode() === "shared" ? " ⇄" : "");
  const weekRow = document.getElementById("weekRow");
  const special = S.tour != null ? viewTour() : (!S.meals.length && !store.get("blank")) ? viewStarter() : S.asking ? viewOut() : null;
  if (special) { app.innerHTML = ro + special; tabs.hidden = true; weekRow.hidden = true; window.scrollTo(0, 0); return; }
  weekRow.hidden = false;
  document.getElementById("wk0").setAttribute("aria-pressed", String(!isNextWeek()));
  document.getElementById("wk1").setAttribute("aria-pressed", String(isNextWeek()));
  tabs.hidden = false;
  tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const focusId = document.activeElement && document.activeElement.id;
  const scrollY = window.scrollY;
  const keep = {}; ["newName", "newCarbName", "extraName"].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  const carbSel = document.getElementById("newCarb"); const keepCarb = carbSel && carbSel.value;
  app.innerHTML = ro + (S.tab === "week" ? viewWeek() : S.tab === "meals" ? viewMeals() : S.tab === "shop" ? viewShop() : viewPick());
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
  const sel = document.getElementById("newCarb");
  if (sel && keepCarb) { sel.value = keepCarb; document.getElementById("newCarbWrap").hidden = sel.value !== "__new"; }
  if (focusId) { const el = document.getElementById(focusId); if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) el.focus(); }
  window.scrollTo(0, scrollY);
}

function carbsOrder(carb) { const i = ["Pasta", "Rice", "Bread", "Potato", "Noodles"].indexOf(carb); return i < 0 ? 6 : i + 1; }
function goWeek(w) {
  if (weekId(w) === weekId(S.week)) return;
  if (S.saveTimer) savePicks(false);
  S.week = w; store.set("week", weekId(w)); subscribeWeek(); render(); window.scrollTo(0, 0);
}
async function startNewWeek() {
  // Plan this week if nothing's been started and it's early in the week; otherwise next week.
  let w = nextWeek();
  try {
    const d = new Date().getDay();
    if (d >= 1 && d <= 4) { const snap = await S.db.doc("weeks/" + weekId(thisWeek())).get(); if (!snap.exists) w = thisWeek(); }
    const snap = await S.db.doc("weeks/" + weekId(w)).get();
    const t = snap.exists && snap.data().target;
    S.askingCurrent = typeof t === "number" ? baseNights() - t : null;
  } catch { S.askingCurrent = null; }
  S.asking = w; render();
}
async function setEveningsOut(n) {
  const w = S.asking; S.asking = null;
  const ref = S.db.doc("weeks/" + weekId(w));
  try {
    const snap = await ref.get();
    await (snap.exists ? ref.update({ target: baseNights() - n }) : ref.set({ target: baseNights() - n, updatedAt: Date.now() }));
  } catch (e) { writeErr(e); }
  if (weekId(w) !== weekId(S.week)) goWeek(w);
  S.plan = Object.assign({}, S.plan, { target: baseNights() - n });
  S.tab = isDone(S.me) ? "week" : "pick"; store.set("tab", S.tab);
  render(); window.scrollTo(0, 0);
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab || t.dataset.goto) { S.tab = t.dataset.tab || t.dataset.goto; store.set("tab", S.tab); S.pendingDelete = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.me) { S.me = t.dataset.me; store.set("me", S.me); S.tab = "pick"; if (!store.get("tour")) S.tour = 0; render(); return; }
  if (t.id === "helpBtn") { if (S.me) { S.tour = 0; render(); } return; }
  if (t.id === "tourNext" || t.id === "tourSkip") {
    if (t.id === "tourNext" && S.tour < tourSteps().length - 1) S.tour++; else { S.tour = null; store.set("tour", "1"); }
    render(); return;
  }
  if (t.id === "starterYes") {
    S.starterBusy = true; render();
    Promise.all(STARTER_MEALS.map(([name, carb, ingredients], i) => S.db.doc("meals/" + slug(name)).set({ name, carb, ingredients, order: 100 * (carbsOrder(carb)) + i })))
      .catch(writeErr).finally(() => { S.starterBusy = false; S.tab = "meals"; render(); });
    return;
  }
  if (t.id === "starterNo") { store.set("blank", "1"); S.tab = "meals"; render(); return; }
  if (t.id === "wk0" || t.id === "wk1") { goWeek(t.id === "wk0" ? thisWeek() : nextWeek()); return; }
  if (t.id === "newWeek") { startNewWeek(); return; }
  if (t.id === "changeOut") { S.asking = new Date(S.week); S.askingCurrent = eveningsOut(); render(); return; }
  if (t.id === "cancelOut") { S.asking = null; render(); return; }
  if (t.dataset.out != null) { setEveningsOut(Number(t.dataset.out)); return; }
  if (t.dataset.mode) {
    const id = t.dataset.meal; const cur = howOf(id); const key = t.dataset.mode;
    const final = weekFinal() || []; if (!final.includes(id)) return;
    if (key === "leftovers" && cur !== "leftovers" && nightsUsed(final) >= target()) return;
    savePlan(final, { [id]: cur === key ? "fresh" : key }); return;
  }
  if (t.id === "renameBtn") { S.editingNames = true; render(); window.scrollTo(0, 0); return; }
  if (t.id === "cancelNames") { S.editingNames = false; render(); return; }
  if (t.id === "acceptIncoming") { applyIncoming(); return; }
  if (t.id === "ignoreIncoming") { S.incoming = null; render(); return; }
  if (t.id === "sendPicks") { sendPicks(); return; }
  if (t.id === "sendPlan") { sendPlan(); return; }
  if (t.id === "sendMeals") { sendLink(mealsPayload(), `Our Dinner Decide meals. Open this to set up your phone.`); return; }
  if (t.id === "passPhone") { S.me = other(S.me); store.set("me", S.me); S.tab = "pick"; render(); window.scrollTo(0, 0); return; }
  if (t.id === "backupBtn") { backupNow(); return; }
  if (t.id === "restoreYes") { const d = S.restoreData; S.restoreData = null; S.db.importAll(d.data); toast("Backup restored."); return; }
  if (t.id === "restoreNo") { S.restoreData = null; render(); return; }
  if (t.id === "whoBtn") { S.me = null; store.set("me", null); S.draft = null; render(); return; }
  if (t.dataset.pick) {
    const set = new Set(myPicks()); const id = t.dataset.pick;
    set.has(id) ? set.delete(id) : set.add(id);
    S.draft = set; render(); queueSave(); return;
  }
  if (t.id === "donePicks") {
    const mine = [...myPicks()];
    savePicks(true); S.draft = null; S.picks[S.me] = { meals: mine, done: true };
    // Second person to finish saves the suggested mix, so the freezer count and shopping list follow it.
    if (isDone(other(S.me)) && !storedFinal()) savePlan(suggestion(matchedFrom(S.picks.a.meals, S.picks.b.meals)));
    render(); window.scrollTo(0, 0); return;
  }
  if (t.id === "editPicks") { S.draft = new Set(myPicks()); savePicks(false); render(); return; }
  if (t.dataset.remove || t.dataset.add) {
    let final = weekFinal() || [];
    if (t.dataset.remove) final = final.filter(id => id !== t.dataset.remove);
    else if (nightsUsed(final) < target() && !final.includes(t.dataset.add)) final = final.concat(t.dataset.add);
    savePlan(final); render(); return;
  }
  if (t.id === "resetPlan") { savePlan(suggestion(matchedFrom(S.picks.a.meals, S.picks.b.meals))); render(); return; }
  if (t.dataset.cross) { const k = t.dataset.cross; writeShop({ crossed: { [k]: !isCrossed(k) } }); return; }
  if (t.dataset.unextra) { writeShop({ extras: { [t.dataset.unextra]: null }, crossed: { ["x-" + t.dataset.unextra]: false } }); return; }
  if (t.id === "stapleMode") { S.stapleMode = !S.stapleMode; render(); return; }
  if (t.dataset.staple) {
    const k = t.dataset.staple; const patch = { items: { [k]: isStaple(k) ? null : t.dataset.name } };
    S.staples = Object.assign({}, S.staples, patch.items); render();
    (S.staplesExists ? S.db.doc("app/staples").update(patch) : S.db.doc("app/staples").set({ items: S.staples }).then(() => { S.staplesExists = true; })).catch(writeErr);
    return;
  }
  if (t.id === "copyList" || t.id === "copyWaitrose") {
    const { items, extras } = shoppingItems(weekFinal() || []);
    const lines = items.filter(i => !isStaple(i.key)).concat(extras).filter(i => !isCrossed(i.key)).map(i => "- " + i.name);
    const kind = t.id === "copyWaitrose" ? "waitrose" : "list";
    const text = kind === "waitrose"
      ? (LOCAL ? "Please add these items to my basket on the supermarket website I have open (I'm logged in)." : "Please add these items to my Waitrose basket on waitrose.com (I'm logged in).") + " For each one, search for it and add one of the most standard everyday version, in a normal household size. Don't check out or change delivery details. When you're done, tell me anything you couldn't find or weren't sure about.\n\n" + lines.join("\n")
      : "Shopping list, " + weekLabel(S.week) + "\n" + lines.join("\n");
    const done = () => { S.copied = kind; render(); setTimeout(() => { if (S.copied === kind) { S.copied = false; render(); } }, kind === "waitrose" ? 12000 : 2000); };
    try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); } catch { fallbackCopy(text, done); }
    return;
  }
  if ("edit" in t.dataset) { S.editing = t.dataset.edit || null; S.nameDraft = null; S.ingDraft = null; S.pendingDelete = null; render(); return; }
  if (t.dataset.flag) {
    const m = mealById(S.editing); if (!m) return;
    const k = t.dataset.flag; const body = { [k]: !m[k] };
    if (k === "defrost" && !m.defrost && m.freezer == null) body.freezer = 0;
    S.db.doc("meals/" + m.id).update(body).catch(writeErr);
    return;
  }
  if (t.dataset.frz) {
    const m = mealById(t.dataset.frz); if (!m) return;
    adjustFreezer(m, Number(t.dataset.d)); render(); return;
  }
  if (t.dataset.del) {
    const id = t.dataset.del;
    if (S.pendingDelete === id) { S.pendingDelete = null; S.db.doc("meals/" + id).delete().catch(writeErr); }
    else { S.pendingDelete = id; render(); }
    return;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "restoreFile" && e.target.files[0]) {
    e.target.files[0].text().then(txt => {
      let d = null; try { d = JSON.parse(txt); } catch {}
      if (!d || d.app !== "dinner-decide" || !d.data) { toast("That file isn't a Dinner Decide backup."); return; }
      S.restoreData = d; render();
    });
    return;
  }
  if (e.target.id === "newCarb") document.getElementById("newCarbWrap").hidden = e.target.value !== "__new";
  if (e.target.id === "editCarb" && S.editing) S.db.doc("meals/" + S.editing).update({ carb: e.target.value }).catch(writeErr);
});
document.addEventListener("input", e => {
  if (e.target.id === "editName" && S.editing) S.nameDraft = { id: S.editing, value: e.target.value };
  if (e.target.id === "editIngr" && S.editing) S.ingDraft = { id: S.editing, value: e.target.value };
});

function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove(); if (ok) done();
}
document.addEventListener("toggle", e => { if (e.target.classList && e.target.classList.contains("cupboard")) S.cupboardOpen = e.target.open; }, true);
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "extraForm") {
    const v = document.getElementById("extraName").value.trim(); if (!v) return;
    document.getElementById("extraName").value = "";
    writeShop({ extras: { [ingKey(v) + "-" + Date.now().toString(36)]: v } });
    return;
  }
  if (e.target.id === "namesForm") {
    const a = document.getElementById("nameA").value.trim(), b = document.getElementById("nameB").value.trim();
    if (!a || !b) return;
    const nights = Number(document.getElementById("nightsSel").value) || baseNights();
    const modeEl = document.querySelector('input[name="modeSel"]:checked');
    S.settings = Object.assign({}, S.settings, { people: { a, b }, nights }, modeEl ? { mode: modeEl.value } : {});
    S.people = { a, b }; S.editingNames = false; render();
    S.db.doc("app/settings").set(S.settings).catch(writeErr);
  }
  if (e.target.dataset.editform) {
    const id = e.target.dataset.editform; const name = document.getElementById("editName").value.trim();
    if (!name) return;
    const seen = new Set();
    const ingredients = document.getElementById("editIngr").value.split(/\n|,/).map(x => x.trim().replace(/\s+/g, " ")).filter(x => x && !seen.has(ingKey(x)) && seen.add(ingKey(x)));
    S.db.doc("meals/" + id).update({ name, ingredients }).catch(writeErr);
    S.editing = null; S.nameDraft = null; S.ingDraft = null; render();
  }
  if (e.target.id === "addForm") {
    const name = document.getElementById("newName").value.trim();
    let carb = document.getElementById("newCarb").value;
    if (carb === "__new") carb = document.getElementById("newCarbName").value.trim();
    if (!name || !carb) return;
    let id = slug(name); while (mealById(id)) id += "-2";
    const maxOrder = Math.max(0, ...(S.meals || []).map(m => m.order ?? 0));
    const sameCarb = (S.meals || []).filter(m => m.carb === carb);
    const order = sameCarb.length ? Math.max(...sameCarb.map(m => m.order ?? 0)) + 0.5 : maxOrder + 100;
    S.db.doc("meals/" + id).set({ name, carb, order }).catch(writeErr);
    document.getElementById("newName").value = "";
    const nc = document.getElementById("newCarbName"); if (nc) nc.value = "";
  }
});

window.addEventListener("hashchange", () => { if (S.db) readIncoming(); });
render();
boot();
</script>
